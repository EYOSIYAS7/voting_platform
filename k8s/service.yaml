apiVersion: v1
kind: Service
metadata:
  name: voting-platform-frontend-service
  namespace: bc-edge-apps
  labels:
    app: voting-platform-frontend
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: voting-platform-frontend
